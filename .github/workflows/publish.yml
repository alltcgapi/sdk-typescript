# Releases go through npm trusted publishing (OIDC): no token in the repository. On npmjs.com, in
# the settings of `@alltcgapi/sdk`: Trusted publisher → GitHub Actions, organization `alltcgapi`,
# repository `sdk-typescript`, workflow `publish.yml`, environment `npm`. The very first version is
# published by hand (`npm publish --access public`): a trusted publisher can only be attached to a
# package that already exists.
#
# A tag publishes: the trusted publisher of this package allows `npm publish`, so the version is
# on the registry when this workflow ends, with no human step in between. Tag only what is ready.
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 is what trusted publishing needs; Node 24 ships it.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          code="$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" src/version.ts)"
          if [ "$tag" != "$version" ] || [ "$tag" != "$code" ]; then
            echo "tag v$tag does not match package.json ($version) and src/version.ts ($code)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # --provenance is explicit on purpose: npm would attach the statement by itself on this
      # path, but with the flag a release that cannot be attested fails instead of going out
      # without one.
      - run: npm publish --access public --provenance
