# Releases go through npm trusted publishing (OIDC): no token in the repository. On npmjs.com, in
# the settings of `@alltcgapi/sdk`: Trusted publisher → GitHub Actions, organization `alltcgapi`,
# repository `sdk-typescript`, workflow `publish.yml`, environment `npm`. The very first version is
# published by hand (`npm publish --access public`): a trusted publisher can only be attached to a
# package that already exists.
#
# A tag does not put the version on the registry: it stages it. The trusted publisher of this
# package allows `npm stage publish` only, so the version waits until a maintainer approves it on
# npmjs.com (account settings, Staged Packages) with 2FA. Nothing reaches users without that step.
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm >= 11.15.0 is what staged publishing needs; Node 24 ships it.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          code="$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" src/version.ts)"
          if [ "$tag" != "$version" ] || [ "$tag" != "$code" ]; then
            echo "tag v$tag does not match package.json ($version) and src/version.ts ($code)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # `npm stage publish`, not `npm publish`: the trusted publisher refuses a direct publish.
      # npm attaches the provenance statement by itself when the release comes through OIDC from
      # a public repository, so there is no --provenance here.
      - run: npm stage publish --access public
